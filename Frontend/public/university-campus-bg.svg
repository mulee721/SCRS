<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="campusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2e4d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a4d7a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <pattern id="brickPattern" x="0" y="0" width="80" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="80" height="60" fill="#15334a" opacity="0.3"/>
      <rect x="0" y="0" width="40" height="30" fill="#1a4d7a" opacity="0.2"/>
      <rect x="40" y="30" width="40" height="30" fill="#1a4d7a" opacity="0.2"/>
    </pattern>
    <filter id="lightGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main gradient background -->
  <rect width="1920" height="1080" fill="url(#campusGradient)"/>

  <!-- Brick pattern overlay -->
  <rect width="1920" height="1080" fill="url(#brickPattern)"/>

  <!-- Building silhouettes on left -->
  <rect x="0" y="400" width="180" height="680" fill="#0a1420" opacity="0.6"/>
  <polygon points="0,400 90,200 180,400" fill="#0d1f35" opacity="0.5"/>
  
  <!-- Windows in building -->
  <g opacity="0.3">
    <rect x="20" y="420" width="25" height="25" fill="#00dceb"/>
    <rect x="55" y="420" width="25" height="25" fill="#00dceb"/>
    <rect x="90" y="420" width="25" height="25" fill="#00dceb"/>
    <rect x="125" y="420" width="25" height="25" fill="#00dceb"/>
    <rect x="20" y="470" width="25" height="25" fill="#00dceb"/>
    <rect x="55" y="470" width="25" height="25" fill="#00dceb"/>
    <rect x="90" y="470" width="25" height="25" fill="#00dceb"/>
    <rect x="125" y="470" width="25" height="25" fill="#00dceb"/>
    <rect x="20" y="520" width="25" height="25" fill="#00dceb"/>
    <rect x="55" y="520" width="25" height="25" fill="#00dceb"/>
    <rect x="90" y="520" width="25" height="25" fill="#00dceb"/>
    <rect x="125" y="520" width="25" height="25" fill="#00dceb"/>
  </g>

  <!-- Library/Main building on right -->
  <rect x="1620" y="500" width="300" height="580" fill="#0a1420" opacity="0.6"/>
  <polygon points="1620,500 1770,250 1920,500" fill="#0d1f35" opacity="0.5"/>
  
  <!-- Windows in main building -->
  <g opacity="0.4">
    <rect x="1650" y="530" width="30" height="30" fill="#00dceb"/>
    <rect x="1700" y="530" width="30" height="30" fill="#00dceb"/>
    <rect x="1750" y="530" width="30" height="30" fill="#00dceb"/>
    <rect x="1800" y="530" width="30" height="30" fill="#00dceb"/>
    <rect x="1850" y="530" width="30" height="30" fill="#00dceb"/>
    <rect x="1650" y="590" width="30" height="30" fill="#00dceb"/>
    <rect x="1700" y="590" width="30" height="30" fill="#00dceb"/>
    <rect x="1750" y="590" width="30" height="30" fill="#00dceb"/>
    <rect x="1800" y="590" width="30" height="30" fill="#00dceb"/>
    <rect x="1850" y="590" width="30" height="30" fill="#00dceb"/>
    <rect x="1650" y="650" width="30" height="30" fill="#00dceb"/>
    <rect x="1700" y="650" width="30" height="30" fill="#00dceb"/>
    <rect x="1750" y="650" width="30" height="30" fill="#00dceb"/>
    <rect x="1800" y="650" width="30" height="30" fill="#00dceb"/>
    <rect x="1850" y="650" width="30" height="30" fill="#00dceb"/>
  </g>

  <!-- Abstract learning symbols - books/graduation -->
  <g opacity="0.08" filter="url(#lightGlow)">
    <circle cx="400" cy="150" r="120" fill="#00dceb"/>
    <circle cx="1200" cy="200" r="100" fill="#00BFD4"/>
    <circle cx="800" cy="950" r="150" fill="#00dceb"/>
    <circle cx="1400" cy="850" r="110" fill="#00BFD4"/>
  </g>

  <!-- Subtle grid pattern (representing campus paths) -->
  <g stroke="#00dceb" stroke-width="1" opacity="0.05">
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="780" x2="1920" y2="780"/>
  </g>

  <!-- Top light rays effect -->
  <g opacity="0.1">
    <rect x="0" y="0" width="1920" height="300" fill="url(#campusGradient)" opacity="0.3"/>
  </g>

  <!-- Atmospheric glow at bottom -->
  <ellipse cx="960" cy="900" rx="800" ry="300" fill="#00dceb" opacity="0.03"/>
</svg>
